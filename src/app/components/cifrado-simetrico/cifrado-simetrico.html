<div class="box">

    <h1>🔐 Cifrar / Descifrar — AES (clave simétrica)</h1>

    <label>Modo</label>
    <div class="row">
        <button (click)="activarTexto()" [class.primary]="modoTexto">Texto</button>
        <button (click)="activarArchivo()" [class.primary]="!modoTexto">Archivo</button>
    </div>

    <!-- TEXTO -->
    <div *ngIf="modoTexto">
        <label>Texto (mensaje o texto cifrado)</label>
        <textarea [(ngModel)]="texto" placeholder="Escribe el texto aquí..."></textarea>
    </div>

    <!-- ARCHIVO -->
    <div *ngIf="!modoTexto">
        <label>Seleccionar archivo</label>
        <input type="file" (change)="onFileSelected($event)" />
        <div class="small">{{ fileInfo }}</div>
    </div>

    <label>Frase / contraseña</label>
    <input type="password" [(ngModel)]="passPhrase" placeholder="Frase segura" />

    <div style="margin-top:10px">
        <button class="primary" (click)="cifrar()">🔒 Cifrar</button>
        <button class="secondary" (click)="descifrar()">🔓 Descifrar</button>
    </div>

    <div id="result" class="info" *ngIf="mensaje">
        <strong>{{ mensaje }}</strong>
        <div style="margin-top:8px">{{ resultado }}</div>
    </div>

</div>
