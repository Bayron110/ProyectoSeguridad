<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cifrado AES </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 18px;
            max-width: 820px;
            margin: auto;
            background: #f6f8fb;
            color: #111;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .box {
            background: white;
            padding: 14px;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: monospace
        }

        input[type="password"],
        input[type="file"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ddd
        }

        button {
            margin-top: 10px;
            padding: 8px 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer
        }

        .primary {
            background: #4b6ef6;
            color: white
        }

        .secondary {
            background: #6c757d;
            color: white
        }

        .info {
            margin-top: 10px;
            padding: 10px;
            background: #eef3ff;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all
        }

        .row {
            display: flex;
            gap: 8px
        }

        .small {
            font-size: 13px;
            color: #555
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>🔐 Cifrar / Descifrar — AES (clave simétrica)</h1>

        <label>Modo</label>
        <div class="row">
            <button id="txtModeBtn" class="primary">Texto</button>
            <button id="fileModeBtn" class="secondary">Archivo</button>
        </div>

        <div id="textAreaSection">
            <label>Texto (mensaje o texto cifrado )</label>
            <textarea id="textData" placeholder="Escribe el texto aquí..."></textarea>
        </div>

        <div id="fileSection" style="display:none">
            <label>Seleccionar archivo</label>
            <input id="fileInput" type="file" />
            <div id="fileInfo" class="small"></div>
        </div>

        <label>Frase / contraseña</label>
        <input id="passPhrase" type="password" placeholder="Frase larga. Ej: una frase segura" />

        <div style="margin-top:10px">
            <button id="encBtn" class="primary">🔒 Cifrar</button>
            <button id="decBtn" class="secondary">🔓 Descifrar</button>
        </div>

        <div id="result" class="info" style="display:none"></div>
    </div>

    <script>

        const txtModeBtn = document.getElementById('txtModeBtn');
        const fileModeBtn = document.getElementById('fileModeBtn');
        const textAreaSection = document.getElementById('textAreaSection');
        const fileSection = document.getElementById('fileSection');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const textData = document.getElementById('textData');
        const passPhrase = document.getElementById('passPhrase');
        const encBtn = document.getElementById('encBtn');
        const decBtn = document.getElementById('decBtn');
        const result = document.getElementById('result');

        let selectedFile = null;

        txtModeBtn.onclick = () => { textAreaSection.style.display = 'block'; fileSection.style.display = 'none'; txtModeBtn.classList.add('primary'); fileModeBtn.classList.remove('primary'); };
        fileModeBtn.onclick = () => { textAreaSection.style.display = 'none'; fileSection.style.display = 'block'; fileModeBtn.classList.add('primary'); txtModeBtn.classList.remove('primary'); };

        fileInput.onchange = e => {
            selectedFile = e.target.files[0] ?? null;
            if (selectedFile) fileInfo.textContent = `Archivo: ${selectedFile.name} — ${(selectedFile.size / 1024).toFixed(2)} KB`;
            else fileInfo.textContent = '';
        };

        // helpers base64 <-> ArrayBuffer (chunk safe)
        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            const CHUNK = 0x8000;
            let binary = '';
            for (let i = 0; i < bytes.length; i += CHUNK) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
            }
            return btoa(binary);
        }
        function base64ToArrayBuffer(base64) {
            const binary = atob(base64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptBytes(plainBytes, password) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveKey(password, salt);
            const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);
            // combined: salt + iv + cipher
            const combined = new Uint8Array(salt.length + iv.length + cipher.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(cipher), salt.length + iv.length);
            return combined.buffer;
        }

        async function decryptBytes(combinedBuffer, password) {
            const combined = new Uint8Array(combinedBuffer);
            if (combined.length < 28) throw new Error('Datos demasiado cortos');
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);
            const key = await deriveKey(password, salt);
            const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
            return plain; // ArrayBuffer
        }

        // Eventos: cifrar
        encBtn.onclick = async () => {
            result.style.display = 'none';
            const pwd = passPhrase.value || '';
            if (!pwd) return showMsg('Ingresa una frase/contraseña para derivar la clave.', true);

            if (textAreaSection.style.display !== 'none') {
                // Texto: cifrar texto plano -> mostrar base64
                const text = textData.value || '';
                if (!text) return showMsg('Ingresa texto para cifrar.', true);
                try {
                    const bytes = new TextEncoder().encode(text);
                    const combined = await encryptBytes(bytes, pwd);
                    const b64 = arrayBufferToBase64(combined);
                    showMsg('Texto cifrado (base64):', false, b64);
                    textData.value = b64; // opcional: reemplaza con el base64 cifrado
                } catch (e) {
                    showMsg('Error al cifrar: ' + e.message, true);
                }
            } else {
                // Archivo: leer, cifrar y descargar archivo.enc
                if (!selectedFile) return showMsg('Selecciona un archivo para cifrar.', true);
                try {
                    const arrBuf = await selectedFile.arrayBuffer();
                    const combined = await encryptBytes(arrBuf, pwd);
                    const blob = new Blob([combined], { type: 'application/octet-stream' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = selectedFile.name + '.enc';
                    a.click();
                    showMsg(`✅ Archivo cifrado. Descarga iniciada: ${selectedFile.name}.enc`);
                } catch (e) {
                    showMsg('Error al cifrar archivo: ' + e.message, true);
                }
            }
        };

        // Eventos: descifrar
        decBtn.onclick = async () => {
            result.style.display = 'none';
            const pwd = passPhrase.value || '';
            if (!pwd) return showMsg('Ingresa la frase/contraseña usada para cifrar.', true);

            if (textAreaSection.style.display !== 'none') {
                // Texto: asumir base64 cifrado en textarea -> decodificar y mostrar texto plano
                const b64 = textData.value || '';
                if (!b64) return showMsg('Pega aquí el base64 cifrado para descifrar.', true);
                try {
                    const buf = base64ToArrayBuffer(b64);
                    const plainBuf = await decryptBytes(buf, pwd);
                    const text = new TextDecoder().decode(plainBuf);
                    showMsg('Texto descifrado:', false, text);
                    textData.value = text;
                } catch (e) {
                    showMsg('Error al descifrar: clave incorrecta o datos corruptos.', true);
                }
            } else {
                // Archivo: seleccionar archivo *.enc -> descifrar y descargar
                if (!selectedFile) return showMsg('Selecciona el archivo cifrado (.enc) para descifrar.', true);
                try {
                    const arrBuf = await selectedFile.arrayBuffer();
                    const plainBuf = await decryptBytes(arrBuf, pwd);
                    const blob = new Blob([plainBuf]);
                    // intentar recuperar nombre original quitando ".enc"
                    const originalName = selectedFile.name.endsWith('.enc') ? selectedFile.name.slice(0, -4) : ('decrypted-' + selectedFile.name);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = originalName;
                    a.click();
                    showMsg(`✅ Archivo descifrado. Descarga iniciada: ${originalName}`);
                } catch (e) {
                    showMsg('Error al descifrar archivo: clave incorrecta o datos corruptos.', true);
                }
            }
        };

        function showMsg(title, isError = false, content = '') {
            result.style.display = 'block';
            result.style.borderLeft = isError ? '4px solid #d9534f' : '4px solid #28a745';
            result.innerHTML = `<strong>${title}</strong><div style="margin-top:8px">${content}</div>`;
        }
    </script>
</body>

</html>
